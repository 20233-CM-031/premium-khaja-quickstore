[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NETLIFY_PREVIEW_DRAWER = "false"

[context.deploy-preview.environment]
  NETLIFY_PREVIEW_DRAWER = "false"

[context.branch-deploy.environment]
  NETLIFY_PREVIEW_DRAWER = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

